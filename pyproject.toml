[project]
name = "django-starter"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.13,<6.2",
    "gunicorn>=23.0",
    "psycopg[binary,pool]>=3.2",
    "whitenoise[brotli]>=6.8",
    "django-environ>=0.12",
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=5.0",
    "ruff>=0.12",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "coverage>=7.6",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "DJ",  # flake8-django
    "S",   # flake8-bandit
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]  # star imports are the settings pattern
"**/tests.py" = ["S101"]                     # assert is fine in tests
"**/test_*.py" = ["S101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py"]
addopts = "--reuse-db --strict-markers"

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests.py", "config/wsgi.py", "config/asgi.py"]
